[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "gridfinity-rebase"
version = "0.1.0"
description = "Fast, validated Gridfinity STL foot replacement"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=2.0,<3", "manifold3d>=3.5,<4"]

[project.scripts]
gridfinity-rebase = "gridfinity_rebase.cli:main"

[dependency-groups]
dev = [
    "networkx>=3.4.2",
    "pre-commit>=4,<5",
    "pytest>=8",
    "ruff>=0.17.0",
    "trimesh>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
source-include = ["tests/**", "docs/**", "scripts/**", "uv.lock"]
